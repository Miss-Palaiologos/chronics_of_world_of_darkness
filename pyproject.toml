[project]
name = "chronics"
version = "0.1.0"
description = "Multi-chronicle container for VTM V5 modern-night chronicles / 多编年史容器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
the-unlisted = "the_unlisted.cli:main"

# 单一工程、单一环境：编年史不再各自成包，而是由根项目统一打包与安装。
[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "chronicles/the-unlisted/src"
module-name = "the_unlisted"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
